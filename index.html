<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Cup Shuffle</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f0ea;
    --ink: #1a1a18;
    --red: #e8231a;
    --muted: #9a9490;
    --cup-w: 130px;
    --cup-lift: 120px;
    --prize-size: 64px;
    --prize-bottom: 10px;
    --slot-gap: 30px;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    overflow: hidden;
    padding: 0 16px;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.2rem, 8vw, 4rem);
    letter-spacing: 0.08em;
    color: var(--ink);
    margin-bottom: 0.05em;
  }

  .subtitle {
    font-size: clamp(0.65rem, 2.5vw, 0.78rem);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8rem;
  }

  /* Stage */
  #stage {
    position: relative;
    width: calc(3 * var(--cup-w) + 2 * var(--slot-gap));
    height: calc(var(--cup-w) * 1.3);
  }

  /* Cup wrapper */
  .cup-wrap {
    position: absolute;
    bottom: 0;
    width: var(--cup-w);
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: default;
    transition: left 0.4s cubic-bezier(0.77,0,0.18,1);
  }

  .cup-wrap.clickable { cursor: pointer; }
  /* Subtle hover — just a tiny lift and soft glow */
  .cup-wrap.clickable:hover .cup-img {
    filter: brightness(1.06) drop-shadow(0 4px 12px rgba(232,35,26,0.18));
    transform: rotate(180deg) translateY(3px);
  }

  /* Prize: sits at the bottom edge of the cup (cup is flipped so opening faces down) */
  .prize {
    position: absolute;
    bottom: var(--prize-bottom);
    width: var(--prize-size);
    height: var(--prize-size);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s ease, transform 0.3s ease;
    transform: translateY(6px);
    pointer-events: none;
    z-index: 0;
  }

  .prize img { width: 100%; height: 100%; object-fit: contain; }

  .prize.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .cup-img {
    width: var(--cup-w);
    position: relative;
    z-index: 2;
    transform: rotate(180deg);
    transition: transform 0.35s ease, filter 0.3s ease;
  }

  /* Lift: move cup upward (in rotated frame, translateY negative = up) */
  .cup-wrap.lifted .cup-img {
    transform: rotate(180deg) translateY(var(--cup-lift));
  }

  /* ── Overlay base ─────────────────────────────────────────── */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(245,240,234,0.93);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
    backdrop-filter: blur(8px);
  }
  .overlay.show { opacity: 1; pointer-events: all; }

  .result-card {
    background: #fff;
    border: 2px solid var(--ink);
    padding: clamp(1.5rem, 5vw, 2.5rem);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.2rem;
    transform: translateY(20px);
    transition: transform 0.4s cubic-bezier(0.16,1,0.3,1) 0.1s;
    width: min(320px, 88vw);
  }
  .overlay.show .result-card { transform: translateY(0); }

  .result-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(1.6rem, 6vw, 2.2rem);
    letter-spacing: 0.1em;
    color: var(--ink);
    text-align: center;
  }

  /* QR canvas area */
  .qr-area {
    width: min(180px, 60vw);
    height: min(180px, 60vw);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qr-area canvas { width: 100%; height: 100%; }

  /* Nothing placeholder — same size as QR */
  .nothing-icon {
    width: min(180px, 60vw);
    height: min(180px, 60vw);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px dashed #ccc;
  }
  .nothing-icon span {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2rem, 8vw, 3.5rem);
    letter-spacing: 0.05em;
    color: #ccc;
    text-align: center;
    line-height: 1.1;
  }

  .result-close {
    font-size: clamp(0.6rem, 2.2vw, 0.68rem);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    transition: color 0.2s;
    background: none;
    border: none;
    font-family: 'DM Mono', monospace;
  }
  .result-close:hover { color: var(--ink); }

  /* Status text */
  #status {
    margin-top: 1.5rem;
    font-size: clamp(0.62rem, 2.5vw, 0.72rem);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    height: 1em;
  }

  /* Replay btn */
  #replay {
    margin-top: 1rem;
    background: var(--ink);
    color: var(--bg);
    border: none;
    font-family: 'DM Mono', monospace;
    font-size: clamp(0.6rem, 2.5vw, 0.68rem);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    padding: 0.7em 2em;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, background 0.2s;
  }
  #replay:hover { background: var(--red); }
  #replay.show { opacity: 1; pointer-events: all; }

  /* Mobile tweaks */
  @media (max-width: 480px) {
    :root {
      --cup-w: 90px;
      --cup-lift: 86px;
      --prize-size: 44px;
      --prize-bottom: 6px;
      --slot-gap: 18px;
    }
  }
</style>

</head>
<body>

<h1>Thanks for Scanning</h1>
<p class="subtitle">Pick your next action</p>

<div id="stage"></div>

<div id="status">what will you choose?</div>
<button id="replay">Play again</button>

<!-- Unified result overlay -->
<div class="overlay" id="resultOverlay">
  <div class="result-card">
    <div class="result-label" id="resultLabel">YouTube</div>
    <div class="qr-area" id="qrArea">
      <img id="qrImg" src="" alt="QR Code" style="width:100%;height:100%;object-fit:contain;">
    </div>
    <div class="nothing-icon" id="nothingIcon" style="display:none">
      <span>EMPTI-<br>NESS</span>
    </div>
    <button class="result-close" id="resultClose">tap anywhere to close</button>
  </div>
</div>

<script>
// ── Images ────────────────────────────────────────────────────────────────────
const photosB64 = 'photos.png';
const youtubeB64 = 'youtube.png';
const cupB64 = 'cup.png';

// ── Helpers ───────────────────────────────────────────────────────────────────
function getSlotPositions() {
  const cupW = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cup-w'));
  const gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--slot-gap'));
  return [0, cupW + gap, 2 * (cupW + gap)];
}

// ── State ─────────────────────────────────────────────────────────────────────
const PRIZES = ['youtube', 'photos', null];
let phase = 'reveal';

// ── DOM ───────────────────────────────────────────────────────────────────────
const stage = document.getElementById('stage');
const statusEl = document.getElementById('status');
const replayBtn = document.getElementById('replay');

function buildPrizeEl(prizeType) {
  const prize = document.createElement('div');
  prize.className = 'prize';
  if (prizeType === 'youtube') {
    const img = document.createElement('img'); img.src = youtubeB64; prize.appendChild(img);
  } else if (prizeType === 'photos') {
    const img = document.createElement('img'); img.src = photosB64; prize.appendChild(img);
  }
  return prize;
}

// Build 3 cups
let cups = [];
function buildCups(shuffledPrizes) {
  stage.innerHTML = '';
  cups = [];
  const slotPos = getSlotPositions();
  [0,1,2].forEach(i => {
    const wrap = document.createElement('div');
    wrap.className = 'cup-wrap';
    wrap.style.left = slotPos[i] + 'px';

    const prize = buildPrizeEl(shuffledPrizes[i]);
    const cupImg = document.createElement('img');
    cupImg.className = 'cup-img';
    cupImg.src = cupB64;
    cupImg.draggable = false;

    wrap.appendChild(prize);
    wrap.appendChild(cupImg);
    stage.appendChild(wrap);
    wrap.addEventListener('click', () => onCupClick(i));

    cups.push({ wrap, prize, cupImg, prizeType: shuffledPrizes[i] });
  });
}

// ── Reveal phase ──────────────────────────────────────────────────────────────
function revealPrizes() {
  statusEl.textContent = 'what will you choose?';
  cups.forEach((c, i) => {
    setTimeout(() => {
      c.wrap.classList.add('lifted');
      c.prize.classList.add('visible');
    }, i * 350);
  });
  setTimeout(() => {
    cups.forEach((c, i) => {
      setTimeout(() => {
        c.wrap.classList.remove('lifted');
        c.prize.classList.remove('visible');
      }, i * 200);
    });
    setTimeout(startShuffle, 900);
  }, 2300);
}

// ── Shuffle phase ─────────────────────────────────────────────────────────────
function startShuffle() {
  statusEl.textContent = 'shuffling...';
  phase = 'shuffle';
  let cupAt = [0, 1, 2];
  const totalSwaps = 20;
  let swapsDone = 0;
  let speed = 380;

  function doSwap() {
    if (swapsDone >= totalSwaps) {
      setTimeout(() => {
        phase = 'pick';
        statusEl.textContent = 'pick a cup';
        cups.forEach(c => c.wrap.classList.add('clickable'));
      }, 300);
      return;
    }
    let s1 = Math.floor(Math.random() * 3);
    let s2;
    do { s2 = Math.floor(Math.random() * 3); } while (s2 === s1);

    const slotPos = getSlotPositions();
    const c1 = cupAt[s1], c2 = cupAt[s2];
    cups[c1].wrap.style.transition = `left ${speed}ms cubic-bezier(0.77,0,0.18,1)`;
    cups[c2].wrap.style.transition = `left ${speed}ms cubic-bezier(0.77,0,0.18,1)`;
    cups[c1].wrap.style.left = slotPos[s2] + 'px';
    cups[c2].wrap.style.left = slotPos[s1] + 'px';
    cupAt[s1] = c2; cupAt[s2] = c1;

    swapsDone++;
    if (swapsDone > 12) speed = 280;
    setTimeout(doSwap, speed);
  }
  setTimeout(doSwap, 400);
}

// ── Pick phase ────────────────────────────────────────────────────────────────
function onCupClick(i) {
  if (phase !== 'pick') return;
  phase = 'done';
  cups.forEach(c => c.wrap.classList.remove('clickable'));
  statusEl.textContent = '';
  cups[i].wrap.classList.add('lifted');
  cups[i].prize.classList.add('visible');

  setTimeout(() => showResult(cups[i].prizeType), 700);
}



// ── Result overlay ────────────────────────────────────────────────────────────
function showResult(prize) {
  const overlay = document.getElementById('resultOverlay');
  const label = document.getElementById('resultLabel');
  const qrArea = document.getElementById('qrArea');
  const nothingIcon = document.getElementById('nothingIcon');

  if (prize === 'youtube') {
    label.textContent = 'YouTube';
    qrArea.style.display = 'flex';
    nothingIcon.style.display = 'none';
    document.getElementById('qrImg').src = 'qr_youtube.png';
  } else if (prize === 'photos') {
    label.textContent = 'Google Photos';
    qrArea.style.display = 'flex';
    nothingIcon.style.display = 'none';
    document.getElementById('qrImg').src = 'qr_photos.png';
  } else {
    label.textContent = 'A Whole Lot Of';
    qrArea.style.display = 'none';
    nothingIcon.style.display = 'flex';
  }

  overlay.classList.add('show');
  replayBtn.classList.add('show');
}

document.getElementById('resultOverlay').addEventListener('click', () => {
  document.getElementById('resultOverlay').classList.remove('show');
});
document.getElementById('resultClose').addEventListener('click', (e) => {
  e.stopPropagation();
  document.getElementById('resultOverlay').classList.remove('show');
});

// ── Replay ────────────────────────────────────────────────────────────────────
replayBtn.addEventListener('click', () => {
  document.getElementById('resultOverlay').classList.remove('show');
  replayBtn.classList.remove('show');
  const shuffled = [...PRIZES].sort(() => Math.random() - 0.5);
  buildCups(shuffled);
  setTimeout(() => { phase = 'reveal'; revealPrizes(); }, 80);
});

// ── Start ─────────────────────────────────────────────────────────────────────
const initialPrizes = [...PRIZES].sort(() => Math.random() - 0.5);
buildCups(initialPrizes);
window.addEventListener('load', () => setTimeout(revealPrizes, 500));
</script>
</body>
</html>
